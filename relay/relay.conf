# ============================================================================
# VibeCheck Relay configuration
# ============================================================================
#
# This file is read by BOTH:
#   - systemd  (EnvironmentFile= in vibecheck-relay.service), and
#   - bash     (/usr/local/bin/vibecheck-relay-run.sh sources it)
#
# Syntax rules that both parsers agree on:
#   - one KEY=VALUE per line, '#' starts a comment
#   - keep the DOUBLE QUOTES around values that contain spaces
#     (VIDEO_OPTS, EXTRA_FFMPEG_ARGS) — both parsers strip them.
#     Without quotes, bash would word-split the line differently than systemd.
#
# After editing, restart the service:
#     sudo systemctl restart vibecheck-relay
#     journalctl -u vibecheck-relay -f
#
# Template:  relay/relay.conf in the VibeCheck repo
# Installer: relay/provision.sh   (creates /etc/vibecheck-relay/relay.conf
#            from this template and never overwrites an existing file)

# --- Camera (RTSP source on the venue's LAN) --------------------------------
# LAN IP of the camera, as seen from the relay (both on the same WiFi/LAN).
CAMERA_IP=192.168.1.50
# RTSP port (standard is 554).
CAMERA_RTSP_PORT=554
# Camera account credentials (NOT the Wi-Fi password — the camera's own
# admin/user account). Create one in the camera's app if it doesn't exist.
CAMERA_USER=admin
CAMERA_PASS=change-me
# RTSP path/stream — CAMERA-DEPENDENT. Common defaults:
#   Reolink (most models):  /h264Preview_01_sub        (sub-stream ≈ 640×360)
#                           /h264Preview_01_main       (main stream, heavier)
#   Tapo C200/C210/C220/C225: /stream1 (main) | /stream2 (sub)
#     (enable RTSP first: Tapo app → camera → Settings → Camera Account)
#   Amcrest:                /cam/realmonitor?channel=1&subtype=1  (sub)
# The sub-stream is preferred: lower bitrate + `-c:v copy` = ~0% CPU.
CAMERA_CHANNEL=/h264Preview_01_sub
# RTSP transport: tcp (recommended — reliable over WiFi) or udp.
RTSP_TRANSPORT=tcp

# --- Mux ingest -------------------------------------------------------------
# The venue's Mux live-stream key. Get it from the VibeCheck Dashboard:
#   log in as the venue owner → "Connect Camera" section → stream key
# (it is created in-app via the Mux API and stored on the venue record).
MUX_STREAM_KEY=REPLACE_WITH_VENUE_MUX_STREAM_KEY
# Mux recommends RTMPS (TLS). ffmpeg in Raspberry Pi OS Lite supports it.
# If a custom ffmpeg build lacks rtmps/TLS, set:
#   MUX_INGEST_PROTOCOL=rtmp   MUX_INGEST_PORT=5222   (Mux plain-RTMP ingest)
MUX_INGEST_PROTOCOL=rtmps
MUX_INGEST_HOST=global-live.mux.com
MUX_INGEST_PORT=443
MUX_INGEST_APP=app
# Full ingest URL = ${MUX_INGEST_PROTOCOL}://${MUX_INGEST_HOST}:${MUX_INGEST_PORT}/${MUX_INGEST_APP}/${MUX_STREAM_KEY}

# --- Video -------------------------------------------------------------------
# Default: NO audio (-an) and stream-copy the camera's H.264 sub-stream
# (-c:v copy = no transcoding, ~0% CPU on the Pi Zero 2 W).
# The privacy playbook REQUIRES -an — do not remove it.
# Only change if the sub-stream isn't H.264 (then ffmpeg logs a codec error;
# e.g. switch to a H.264 main stream or add a transcode like -c:v libx264).
VIDEO_OPTS="-an -c:v copy"
# Extra ffmpeg flags (optional). Keep -loglevel warning so journald stays quiet
# during normal operation. Space-separated, quoted.
EXTRA_FFMPEG_ARGS="-loglevel warning"
